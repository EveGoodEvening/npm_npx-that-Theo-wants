version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safenpm
      POSTGRES_PASSWORD: safenpm_dev
      POSTGRES_DB: safenpm
    ports:
      - '5432:5432'
    volumes:
      - safenpm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safenpm']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: safenpm
      MINIO_ROOT_PASSWORD: safenpm_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - safenpm_miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  safenpm_pgdata:
  safenpm_miniodata:
